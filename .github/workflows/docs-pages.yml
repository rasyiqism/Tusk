name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble Documentation Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble _site preserving repo paths
        run: |
          mkdir -p _site/docs
          cp docs/pages/index.html docs/pages/_sidebar.md docs/pages/.nojekyll _site/
          cp README.md CHANGELOG.md SECURITY.md CONTRIBUTING.md LICENSE _site/
          cp docs/DEPLOYMENT.md docs/ARCHITECTURE.md docs/API.md _site/docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
