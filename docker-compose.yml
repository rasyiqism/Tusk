services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?Set PG_SUPERUSER_PASSWORD in Dokploy Environment or .env}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:-pgbouncer_auth_default_change_me}
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "password_encryption=scram-sha-256"
      - "-c"
      - "log_statement=ddl"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-200}"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-4MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}"
    volumes:
      - pg_shared_data:/var/lib/postgresql/data
      - ./scripts/init-auth-query.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pg_internal

  pgbouncer:
    build: ./pgbouncer
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      AUTH_USER: pgbouncer_auth
      AUTH_DBNAME: postgres
      AUTH_QUERY: "SELECT usename, passwd FROM pgbouncer.user_lookup($1)"
      MAX_CLIENT_CONN: ${PGB_MAX_CLIENT_CONN:-2000}
      DEFAULT_POOL_SIZE: ${PGB_DEFAULT_POOL_SIZE:-15}
      RESERVE_POOL_SIZE: ${PGB_RESERVE_POOL_SIZE:-5}
      MAX_PREPARED_STATEMENTS: 200
      ADMIN_USERS: postgres
      CLIENT_TLS_SSLMODE: ${PGB_TLS_MODE:-allow}
      CLIENT_TLS_CERT_FILE: /etc/pgbouncer/tls/server.crt
      CLIENT_TLS_KEY_FILE: /etc/pgbouncer/tls/server.key
      PG_SUPERUSER_PASSWORD: ${PG_SUPERUSER_PASSWORD:?Set PG_SUPERUSER_PASSWORD in Dokploy Environment or .env}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:-pgbouncer_auth_default_change_me}
    ports:
      - "${PGB_BIND_IP:-0.0.0.0}:${PGB_PORT:-6432}:6432"
    volumes:
      - pgbouncer_tls:/etc/pgbouncer/tls
    command:
      - "/bin/sh"
      - "-c"
      - |
        mkdir -p /etc/pgbouncer/tls
        if [ ! -f /etc/pgbouncer/tls/server.crt ] || [ ! -f /etc/pgbouncer/tls/server.key ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout /etc/pgbouncer/tls/server.key \
            -out /etc/pgbouncer/tls/server.crt \
            -subj "/CN=pgbouncer" \
            -addext "subjectAltName=DNS:localhost,DNS:pgbouncer,IP:127.0.0.1" 2>/dev/null
          chmod 600 /etc/pgbouncer/tls/server.key
          chmod 644 /etc/pgbouncer/tls/server.crt
        fi
        printf '"pgbouncer_auth" "%s"\n"postgres" "%s"\n' "$${PGBOUNCER_AUTH_PASSWORD:-pgbouncer_auth_default_change_me}" "$$PG_SUPERUSER_PASSWORD" > /etc/pgbouncer/userlist.txt
        grep -q auth_dbname /etc/pgbouncer/pgbouncer.ini || echo 'auth_dbname = postgres' >> /etc/pgbouncer/pgbouncer.ini
        exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    networks:
      - pg_internal

  pg-panel:
    image: ${PANEL_IMAGE:-tusk-pg-panel:local}
    build: ./panel
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "3000"
    ports:
      - "${PANEL_BIND_IP:-127.0.0.1}:${PANEL_PORT:-4310}:3000"
    environment:
      PG_ADMIN_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD:?Set PG_SUPERUSER_PASSWORD in Dokploy Environment or .env}@postgres:5432/postgres
      PGB_ADMIN_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD}@pgbouncer:6432/pgbouncer
      PGB_TX_ADMIN_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD}@pgbouncer:6432/pgbouncer
      PANEL_ADMIN_PASSWORD_HASH: ${PANEL_ADMIN_PASSWORD_HASH:-}
      PANEL_ADMIN_PASSWORD_HASH_B64: ${PANEL_ADMIN_PASSWORD_HASH_B64:-}
      PANEL_TOTP_SECRET: ${PANEL_TOTP_SECRET:-}
      MASTER_KEY: ${MASTER_KEY:?Set MASTER_KEY (min 16 chars) in Dokploy Environment or .env}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      NTFY_URL: ${NTFY_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALLOW_INTERNAL_URLS: ${ALLOW_INTERNAL_URLS:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      PUBLIC_DB_HOST: ${PUBLIC_DB_HOST:-localhost}
      PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-200}
      DATA_DIR: /app/data
    volumes:
      - panel_sqlite:/app/data
    networks:
      - pg_internal

volumes:
  pg_shared_data:
  pgbouncer_tls:
  panel_sqlite:

networks:
  pg_internal:
    driver: bridge
