services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?Set PG_SUPERUSER_PASSWORD in Dokploy Environment or .env}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:-pgbouncer_auth_default_change_me}
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "password_encryption=scram-sha-256"
      - "-c"
      - "log_statement=ddl"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "max_connections=200"
    volumes:
      - pg_shared_data:/var/lib/postgresql/data
      - ./scripts/init-auth-query.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pg_internal

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      AUTH_USER: pgbouncer_auth
      AUTH_DBNAME: postgres
      AUTH_QUERY: "SELECT usename, passwd FROM pgbouncer.user_lookup($1)"
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 25
      MAX_PREPARED_STATEMENTS: 200
      ADMIN_USERS: postgres
      CLIENT_TLS_SSLMODE: ${PGB_TLS_MODE:-disable}
      PG_SUPERUSER_PASSWORD: ${PG_SUPERUSER_PASSWORD:?Set PG_SUPERUSER_PASSWORD in Dokploy Environment or .env}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:-pgbouncer_auth_default_change_me}
    ports:
      - "${PGB_BIND_IP:-127.0.0.1}:${PGB_PORT:-6432}:6432"
    command:
      - "/bin/sh"
      - "-c"
      - |
        printf '"pgbouncer_auth" "%s"\n"postgres" "%s"\n' "$${PGBOUNCER_AUTH_PASSWORD:-pgbouncer_auth_default_change_me}" "$$PG_SUPERUSER_PASSWORD" > /etc/pgbouncer/userlist.txt
        grep -q auth_dbname /etc/pgbouncer/pgbouncer.ini || echo 'auth_dbname = postgres' >> /etc/pgbouncer/pgbouncer.ini
        exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    networks:
      - pg_internal

  pg-panel:
    image: ${PANEL_IMAGE:-tusk-pg-panel:local}
    build: ./panel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    expose:
      - "3000"
    ports:
      - "${PANEL_BIND_IP:-127.0.0.1}:${PANEL_PORT:-4310}:3000"
    environment:
      PG_ADMIN_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD:?Set PG_SUPERUSER_PASSWORD in Dokploy Environment or .env}@postgres:5432/postgres
      PGB_ADMIN_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD}@pgbouncer:6432/pgbouncer
      PGB_TX_ADMIN_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD}@pgbouncer:6432/pgbouncer
      PANEL_ADMIN_PASSWORD_HASH: ${PANEL_ADMIN_PASSWORD_HASH:-}
      PANEL_ADMIN_PASSWORD_HASH_B64: ${PANEL_ADMIN_PASSWORD_HASH_B64:-}
      PANEL_TOTP_SECRET: ${PANEL_TOTP_SECRET:-}
      MASTER_KEY: ${MASTER_KEY:?Set MASTER_KEY (min 16 chars) in Dokploy Environment or .env}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      NTFY_URL: ${NTFY_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALLOW_INTERNAL_URLS: ${ALLOW_INTERNAL_URLS:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      PUBLIC_DB_HOST: ${PUBLIC_DB_HOST:-localhost}
      DATA_DIR: /app/data
    volumes:
      - panel_sqlite:/app/data
    networks:
      - pg_internal

volumes:
  pg_shared_data:
  panel_sqlite:

networks:
  pg_internal:
    driver: bridge
