services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "password_encryption=scram-sha-256"
      - "-c"
      - "log_statement=ddl"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "max_connections=200"
    volumes:
      - pg_shared_data:/var/lib/postgresql/data
      - ./init-auth-query.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pg_internal

  pgbouncer-tx:
    image: edoburu/pgbouncer:v1.23.1-p0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      AUTH_USER: pgbouncer_auth
      AUTH_DBNAME: postgres
      AUTH_QUERY: "SELECT usename, passwd FROM pgbouncer.user_lookup($1)"
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 25
      MAX_PREPARED_STATEMENTS: 200
      ADMIN_USERS: postgres
      CLIENT_TLS_SSLMODE: ${PGB_TLS_MODE:-allow}
      CLIENT_TLS_CERT_FILE: /etc/pgbouncer/tls/server.crt
      CLIENT_TLS_KEY_FILE: /etc/pgbouncer/tls/server.key
    ports:
      - "${PGB_BIND_IP:-127.0.0.1}:${PGB_TX_PORT:-6432}:6432"
    volumes:
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - ./pgbouncer/tls:/etc/pgbouncer/tls:ro
    command: ["/bin/sh", "-c", "grep -q auth_dbname /etc/pgbouncer/pgbouncer.ini || echo 'auth_dbname = postgres' >> /etc/pgbouncer/pgbouncer.ini; exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini"]
    networks:
      - pg_internal

  pgbouncer-session:
    image: edoburu/pgbouncer:v1.23.1-p0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      LISTEN_PORT: 6433
      POOL_MODE: session
      AUTH_TYPE: scram-sha-256
      AUTH_USER: pgbouncer_auth
      AUTH_DBNAME: postgres
      AUTH_QUERY: "SELECT usename, passwd FROM pgbouncer.user_lookup($1)"
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      ADMIN_USERS: postgres
      CLIENT_TLS_SSLMODE: ${PGB_TLS_MODE:-allow}
      CLIENT_TLS_CERT_FILE: /etc/pgbouncer/tls/server.crt
      CLIENT_TLS_KEY_FILE: /etc/pgbouncer/tls/server.key
    ports:
      - "${PGB_BIND_IP:-127.0.0.1}:${PGB_SESS_PORT:-6433}:6433"
    volumes:
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - ./pgbouncer/tls:/etc/pgbouncer/tls:ro
    command: ["/bin/sh", "-c", "grep -q auth_dbname /etc/pgbouncer/pgbouncer.ini || echo 'auth_dbname = postgres' >> /etc/pgbouncer/pgbouncer.ini; exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini"]
    networks:
      - pg_internal

  pg-panel:
    build: ./panel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer-tx:
        condition: service_started
      pgbouncer-session:
        condition: service_started
    ports:
      - "${PANEL_PORT:-3000}:3000"
    environment:
      PG_ADMIN_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD}@postgres:5432/postgres
      PGB_TX_ADMIN_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD}@pgbouncer-tx:6432/pgbouncer
      PGB_SESS_ADMIN_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD}@pgbouncer-session:6433/pgbouncer
      PANEL_ADMIN_PASSWORD_HASH: ${PANEL_ADMIN_PASSWORD_HASH}
      PANEL_TOTP_SECRET: ${PANEL_TOTP_SECRET:-}
      MASTER_KEY: ${MASTER_KEY}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      DEDICATED_WALG_IMAGE: ${DEDICATED_WALG_IMAGE:-postgres:17-walg}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      NTFY_URL: ${NTFY_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      PUBLIC_DB_HOST: ${PUBLIC_DB_HOST:-localhost}
      DATA_DIR: /app/data
    volumes:
      - panel_sqlite:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - pg_internal

  wireguard:
    image: ghcr.io/wg-easy/wg-easy:14
    profiles: ["wireguard"]
    restart: unless-stopped
    environment:
      WG_HOST: ${PUBLIC_DB_HOST:-localhost}
      PASSWORD_HASH: ${PANEL_ADMIN_PASSWORD_HASH}
    volumes:
      - wg_config:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - pg_internal

volumes:
  pg_shared_data:
  panel_sqlite:
  wg_config:

networks:
  pg_internal:
    driver: bridge
