<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tusk — Self-Hosted PostgreSQL Control Panel Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Zero-bloat self-hosted PostgreSQL control panel documentation: Dokploy deployment, scaling, SQLite crash safety, and bidirectional Layer 2 standby." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css" />
  <style>
    :root {
      --base-background-color: #09090b;
      --sidebar-background: #111114;
      --accent-color: #10b981;
      --border-color: #27272a;
      --text-color: #e4e4e7;
      --muted-color: #a1a1aa;
    }
    html, body {
      background-color: var(--base-background-color);
      color: var(--text-color);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .sidebar {
      background-color: var(--sidebar-background);
      border-right: 1px solid var(--border-color);
      color: var(--text-color);
    }
    .sidebar .app-name-link {
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .sidebar ul li a {
      color: var(--muted-color);
      font-size: 14px;
    }
    .sidebar ul li.active > a,
    .sidebar ul li a:hover {
      color: var(--accent-color);
      border-right-color: var(--accent-color);
    }
    .search input {
      background: #18181b !important;
      color: var(--text-color) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 8px;
    }
    .markdown-section {
      max-width: 900px;
      color: var(--text-color);
    }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section strong {
      color: #ffffff;
    }
    .markdown-section a {
      color: var(--accent-color);
    }
    .markdown-section code {
      background-color: #18181b;
      color: #6ee7b7;
      border-radius: 4px;
      padding: 2px 6px;
    }
    .markdown-section pre {
      background-color: #111114 !important;
      border: 1px solid var(--border-color);
      border-radius: 10px;
    }
    .markdown-section pre > code {
      background-color: transparent !important;
      color: #e4e4e7;
      padding: 0;
    }
    .markdown-section table th,
    .markdown-section table td {
      border-color: var(--border-color);
    }
    .markdown-section table tr {
      background-color: transparent !important;
      border-top-color: var(--border-color);
    }
    .markdown-section table tr:nth-child(2n) {
      background-color: #111114 !important;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--accent-color);
      background: #111114;
      color: #d4d4d8;
      padding: 10px 16px;
      border-radius: 0 8px 8px 0;
    }
    .mermaid {
      background: #111114;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin: 16px 0;
      text-align: center;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div id="app">Loading Tusk documentation...</div>
  <script>
    window.$docsify = {
      name: "Tusk Docs",
      repo: "https://github.com/rasyiqism/Tusk",
      homepage: "README.md",
      loadSidebar: true,
      subMaxLevel: 3,
      relativePath: true,
      auto2top: true,
      search: {
        maxAge: 3600000,
        paths: "auto",
        placeholder: "Search documentation...",
        noData: "No results found.",
        depth: 4,
      },
      plugins: [
        function renderMermaidDiagrams(hook) {
          hook.afterEach(function (html) {
            var doc = new DOMParser().parseFromString(html, "text/html");
            doc.querySelectorAll('pre[data-lang="mermaid"]').forEach(function (pre) {
              var container = document.createElement("div");
              container.className = "mermaid";
              container.textContent = pre.textContent || "";
              pre.replaceWith(container);
            });
            return doc.body.innerHTML;
          });
          hook.doneEach(function () {
            if (window.mermaid) {
              window.mermaid.run({ querySelector: ".mermaid" }).catch(function () {});
            }
          });
        },
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      window.mermaid.initialize({
        startOnLoad: false,
        theme: "dark",
      });
    }
  </script>
</body>
</html>
